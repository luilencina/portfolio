name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm

      - name: Check Node version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages base path
        shell: bash
        run: |
          sed -i 's|="/assets/|="/portfolio/assets/|g' build/client/index.html
          sed -i 's|import "/assets/|import "/portfolio/assets/|g' build/client/index.html

      - name: Check build output
        run: |
          echo "===== BUILD ====="
          ls -la build

          echo "===== CLIENT ====="
          ls -la build/client

          echo "===== INDEX.HTML ====="
          cat build/client/index.html

          echo "===== ASSET PATHS ====="
          grep -o '"/portfolio/assets/[^"]*"' build/client/index.html || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
