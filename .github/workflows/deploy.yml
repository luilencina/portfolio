name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate EmailJS configuration
        run: |
          test -n "$VITE_EMAILJS_SERVICE_ID" || exit 1
          test -n "$VITE_EMAILJS_TEMPLATE_ID" || exit 1
          test -n "$VITE_EMAILJS_PUBLIC_KEY" || exit 1
          echo "EmailJS environment variables configured successfully"
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages
        run: |
          mkdir -p deploy

          cp -R build/client/. deploy/

          echo "Corrigindo caminhos dos assets..."

          find deploy -type f \( \
            -name "*.html" \
            -o -name "*.js" \
            -o -name "*.css" \
            -o -name "*.json" \
          \) -exec sed -i \
            -e 's|"/assets/|"/portfolio/assets/|g' \
            -e "s|'/assets/|'/portfolio/assets/|g" \
            -e 's|(/assets/|(/portfolio/assets/|g' \
            -e 's|url(/assets/|url(/portfolio/assets/|g' \
            -e 's|url("/assets/|url("/portfolio/assets/|g' \
            -e "s|url('/assets/|url('/portfolio/assets/|g" \
            {} +

          echo "Criando fallback do GitHub Pages..."

          cp deploy/index.html deploy/404.html

          touch deploy/.nojekyll

          echo "Arquivos publicados:"

          find deploy -maxdepth 3 -type f | sort

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
